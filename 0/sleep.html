const swalst = Swal.mixin({timer: 250000, allowOutsideClick: false, showConfirmButton: false, timerProgressBar: true, imageHeight: 90, imageWidth: 90}); 
const swals = Swal.mixin({allowOutsideClick: false, cancelButtonColor: '#FF0040', imageHeight: 90, imageWidth: 90,});

//Kecepatan ketik (ms per karakter), dipakai juga untuk menghitung timer dinamis
const kecepatanketik = 18;

//Animasi ketik (TypeIt), resolve ketika afterComplete
function ketik(el, teks, kecepatan){
  return new Promise(function(resolve){
    new TypeIt(el, {delay:0, strings: teks, speed: kecepatan || kecepatanketik, cursor: true, afterComplete: function(instance){ instance.destroy(); resolve(); }}).go();
  });
}

//Hitung perkiraan lama ketik (ms) dari jumlah karakter teks, tag HTML tidak dihitung
function hitungdurasiketik(daftarteks){
  var total = 0;
  var tmp = document.createElement('div');
  daftarteks.forEach(function(t){
    tmp.innerHTML = t || '';
    total += (tmp.textContent || '').length;
  });
  return total * kecepatanketik + 150;
}

//Pengganti swals.fire: teks diketik, tombol muncul setelah selesai, timer ikut berjalan selama mengetik (durasi ketik ditambahkan ke timer)
async function ketikfire(opsi, mixin){
  var dasar = mixin || swals;
  return dasar.fire(Object.assign({}, opsi, {
    didOpen: async function(){
      var judul = Swal.getTitle();
      var isi = Swal.getHtmlContainer();
      var aksi = Swal.getActions();
      var punyaTimer = !!Swal.getTimerLeft();
      aksi.style.display = 'none';
      var daftar = [judul, isi];
      var teks = daftar.map(function(el){ return el ? el.innerHTML : ''; });
      //Timer dinamis: tambahkan durasi ketik ke timer yang sudah berjalan
      if(punyaTimer) Swal.increaseTimer(hitungdurasiketik(teks));
      daftar.forEach(function(el){
        if(el && el.innerHTML){
          el.style.minHeight = el.offsetHeight + 'px';
          el.innerHTML = '';
        }
      });
      for(var i = 0; i < daftar.length; i++){
        if(daftar[i] && teks[i]) await ketik(daftar[i], teks[i]);
      }
      if(!Swal.isVisible()) return;
      aksi.style.display = '';
    }
  }));
}
