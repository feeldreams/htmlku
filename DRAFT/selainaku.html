:root {

svg{vertical-align: middle;width: 22px;height: 22px;fill: #fff}

<script>
var ketikanPertama = "<b>Mending Sini Jadi Punyaku Aja 🤣😍🫶</b>";

function animasiTeks(){

    new TypeIt("#textUtama", {
    strings: [ketikanPertama + '<br>' + ketikanKedua], startDelay: 300, speed: kecepatanNgetik, cursor: true,
