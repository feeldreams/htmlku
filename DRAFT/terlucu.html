      audio.play();

    // Halaman 3: Memory Game
    let kartuDibuka = [];
    let pasanganCocok = 0;
    let gameJalan = false;

    function acakKartu(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function mulaiHal3() {
      kartuDibuka = [];
	  pasanganCocok = 0;
	  gameJalan = true;
	  document.getElementById('kotakPesan').innerHTML = '';
	  document.getElementById('lanjut').classList.add('sembunyi');
	  document.getElementById('ulang').classList.add('sembunyi');
	  //selesaiGame(true);
	
	  const papanGame = document.getElementById('papanGame');
	  papanGame.innerHTML = '';
	  kartu.forEach((card, index) => {
	    const elemenKartu = document.createElement('div');
	    elemenKartu.className = 'kartu';
	    elemenKartu.dataset.id = card.id;
	    elemenKartu.innerHTML = `
	      <div class="dalemKartu">
	        <div class="depanKartu">❔</div>
	        <div class="belakangKartu">${card.icon}</div>
	      </div>
	    `;
	    elemenKartu.addEventListener('click', () => balikKartu(elemenKartu, card, index));
	    papanGame.appendChild(elemenKartu);
	  });
    }

    function balikKartu(elemenKartu, card, index) {
      if (!gameJalan || kartuDibuka.length >= 2 || elemenKartu.classList.contains('balik')) return;
      elemenKartu.classList.add('balik');
      kartuDibuka.push({ elemen: elemenKartu, card, index });

      if (kartuDibuka.length === 2) {
        const [kartu1, kartu2] = kartuDibuka;
        if (kartu1.card.id === kartu2.card.id) {
          pasanganCocok++;
          /*
          const divPesan = document.createElement('p');
          divPesan.innerText = kartu1.card.pesan;
          document.getElementById('kotakPesan').appendChild(divPesan);
          */
          kartuDibuka = [];
          if (pasanganCocok === 6) selesaiGame(true);
        } else {
          setTimeout(() => {
            kartu1.elemen.classList.remove('balik');
            kartu2.elemen.classList.remove('balik');
            kartuDibuka = [];
          }, 450);
        }
      }
    }

    function selesaiGame(sukses) {
      gameJalan = false;
      const status = document.getElementById('statusGame');
      if (sukses) {

        /*status.innerText = 'Yeay! Kamu mengenang semua momen kita! ðŸŒ¹';

      }
    }

    // Navigasi Halaman
    function pindahHal(hal) {
  const halaman = ['hal1', 'hal2', 'hal3', 'hal4'];
  for (let i = 1; i <= 3; i++) {
        if (hal < 3) document.getElementById(`hal${i}`).classList.add('sembunyi');
      }
      if (hal < 3) document.getElementById(`hal${hal}`).classList.remove('sembunyi');
      
  const elemenTarget = document.getElementById(halaman[hal - 1]); // Sesuaikan index (1-based to 0-based)
  if (elemenTarget && hal <= halaman.length) elemenTarget.classList.remove('sembunyi');

  setTimeout(() => {
    if (hal === 2) {
      hal1.classList.add('sembunyi');
      
      mulaiHalPassword(); // Fungsi untuk halaman password
      const hal2 = document.getElementById('hal2');
      if (hal2) hal2.classList.add('active');

      if (circgroup) circgroup.style = "opacity:0;transition:all .7s ease";
      setTimeout(()=>{hatiterbang.style="display:block";}, 400);
    }
    if (hal === 3) {
      const hal2 = document.getElementById('hal2');
      if (hal2) {
        hal2.style = "transform:scale(0);opacity:0;transition:all .7s ease";
        setTimeout(() => {
          hal2.classList.add('sembunyi');
          mulaiHal3();
          const hal3 = document.getElementById('hal3');
          if (hal3) hal3.style = "margin-top:120px;transform:scale(1);opacity:1;transition:all .7s ease";
          const circgroup = document.getElementById('circgroup');
          if (circgroup) circgroup.style = "opacity:0;transition:all .7s ease";
        }, 500); 
      }
    }
    if (hal === 4) {
      const hal3 = document.getElementById('hal3');
      if (hal3) {
        hal3.style = "transform:scale(0);opacity:0;transition:all .7s ease";
        setTimeout(() => {
          hal3.classList.add('sembunyi');
          mulaiHal4();
          const hal4 = document.getElementById('hal4');
          if (hal4) hal4.style = "margin-top:100px;transform:scale(1);opacity:1;transition:all .7s ease";
          const circgroup = document.getElementById('circgroup');
          if (circgroup) circgroup.style = "opacity:1;transition:all .7s ease";
        }, 500); // Jeda 500ms sebelum menampilkan hal4
      }
    }
    if (hal !== 2 && hal !== 3 && hal !== 4) {
      const prevHal = document.getElementById(halaman[hal - 2]); // Elemen sebelumnya
      if (prevHal) prevHal.style = "transform:scale(0);opacity:0;transition:all .7s ease";
      setTimeout(() => {
        if (prevHal) prevHal.classList.add('sembunyi');
        const currentHal = document.getElementById(halaman[hal - 1]);
        if (currentHal) currentHal.classList.remove('sembunyi');
        setTimeout(() => {
          if (currentHal) currentHal.style = "transform:scale(1);opacity:1;transition:all .7s ease";
        }, 100);
      }, 500);
    }
  }, 50);
}

    // Password Input Logic
    let password = '';

	function inputPassword(num) {
	  if (password.length < 4) {
	    password += num;
	    updatePinDisplay();
	    if (password.length === 4) {
	      setTimeout(checkPassword,500);
	    }
	  }
	}
	
	function updatePinDisplay() {
	  const pins = ['pin1', 'pin2', 'pin3', 'pin4'];
	  pins.forEach((pinId, index) => {
	    const pin = document.getElementById(pinId);
	    if (pin) {
	      pin.textContent = password[index] || ''; // Tampilkan angka langsung atau kosongkan jika belum ada
	    }
	  });
	}
	
	function checkPassword() {
	  const status = document.getElementById('passwordStatus');
	  if (status) {
	    if (password === pinPassword) { // Pastikan password yang benar
	      status.textContent = 'Yeayy benerr! 🥳';
          status.style="transform:scale(1);opacity:1";
	      setTimeout(() => {
		    hatiterbang.style="";
	        pindahHal(3); // Lanjut ke halaman 3 (Memory Game)
	      }, 1500);
	    } else {
	      status.textContent = 'Oops, coba lagi ya! 💔';
          status.style="transform:scale(1);opacity:1";
	      password = '';
	      updatePinDisplay();
	      setTimeout(() => {
	        if (status) status.textContent = '';
	      }, 2000);
	    }
	  }
	}
	
	function mulaiHalPassword() {
	  password = '';
	  const status = document.getElementById('passwordStatus');
	  if (status) status.textContent = '';
	  updatePinDisplay();
	}
