<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍃 mana.feeldream.id</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Handlee&family=Sriracha&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/typeit@8.7.0/dist/index.umd.js"></script><link rel="stylesheet" href="">
</head>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--color-flap:#d46a84;--color-env:#f8e1e9;--color-env2:#D4AFB8;--color-heart:#ff6f91;--color-sparkle:#ffd1dc}
  body {color:#fff;overflow-x:hidden;position:relative;font-family:'Montserrat',sans-serif;background:rgba(0,0,0,1);z-index: 1;}
  .background-overlay {animation: jj 8s infinite alternate;position: fixed;top: 0;left: 0;width: 100%;height: 100%;background-size: cover;opacity: 0.5;z-index: 0;}
  @keyframes jj{0%  {transform: scale(1);} 50% {transform: scale(1.2);} 100% {transform: scale(1);}}
  .kotak{margin:0 auto;margin-top:130px;transform:scale(0);transition:all .7s ease;background:linear-gradient(145deg, rgb(197 120 153 / 60%) 0%, rgb(122 96 174 / 55%) 50%, rgb(94 168 154 / 50%) 100%);backdrop-filter:blur(8px);border-radius:18px 33px 18px 33px;box-shadow:0 8px 32px rgba(190,140,220,.35),inset 0 0 30px rgba(255,255,255,.12);border:2.5px solid rgba(255,255,255,.9);padding:0;text-align:center;max-width:100%;width:400px;min-height:200px;position:relative;z-index:1}
  .kotak::before{content:"";position:absolute;inset:0;border-radius:30px;padding:2.5px;background:linear-gradient(45deg, #ffc2dd 0%, transparent 30%, transparent 70%, #b9f0e0 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
  .decor{position:absolute;width:12px;height:12px;border:3.3px solid #ff80ab;border-radius:3px;z-index:3}
  .decor-tl{top:10px;left:10px;border-right:none;border-bottom:none}
  .decor-br{bottom:10px;right:10px;border-left:none;border-top:none}
  #envelope{margin:0 auto;margin-top:150px;position:relative;width:120px;height:82.5px;border-bottom-left-radius:6px;border-bottom-right-radius:6px;top:160px;background-color:var(--color-flap);box-shadow:0 4px 20px rgba(0,0,0,0.1)}
  .front{position:absolute;width:0;height:0;z-index:3}
  .flap{border-left:80px solid transparent;border-right:80px solid transparent;border-bottom:55px solid transparent;border-top:55px solid var(--color-flap);transform-origin:top;pointer-events:none}
  .pocket{border-left:80px solid var(--color-env);border-right:8px solid var(--color-env);border-bottom:55px solid var(--color-env2);border-top:55px solid transparent;border-bottom-left-radius:6px;border-bottom-right-radius:6px}
  .letter{position:relative;background-color:#e0d9dd;width:90%;margin:0 auto;height:100%;top:0%;border-radius:6px;box-shadow:0 2px 26px rgba(0,0,0,0.08);padding:15px;box-sizing:border-box}
  .letter:after{content:'';position:absolute;top:0;bottom:0;left:0;right:0;background-image:linear-gradient(180deg,rgba(255,255,255,0) 25%,rgba(255,231,236,0.7) 55%,rgba(255,231,236,1) 100%)}
  .flap,.pocket{border-left-width:60px;border-right-width:60px;border-bottom-width:41.25px;border-top-width:41.25px}.letter{padding:10px}
  .message{position:relative;z-index:2;font-family:'Handlee',cursive;color:#d46a84;text-align:center;line-height:1;padding-top:0}
  .message p{margin:10px 0;font-size:1.2em;text-shadow:0 2px 3px rgba(0,0,0,0.1)}
  .envlope-wrapper{height:210px;margin-top:0px;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .open .flap{transform:rotateX(180deg);transition:transform 0.4s ease,z-index 0.6s;z-index:1}
  .close .flap{transform:rotateX(0deg);transition:transform 0.4s 0.6s ease,z-index 1s;z-index:5}
  .close .letter{transform:translateY(0);transition:transform 0.4s ease,z-index 1s;z-index:1}
  .open .letter{transform:translateY(-40px) rotate(-2.5deg);transition:transform 0.4s 0.2s ease,z-index 0.6s;z-index:2}
  .letter-corner{position:absolute;width:10px;height:10px;border:1px solid #ffd1dc;border-radius:2.5px;z-index:3}
  .corner-tl{top:5px;left:5px;border-right:none;border-bottom:none}
  .corner-br{bottom:5px;right:5px;border-left:none;border-top:none}
  .hearts,.sparkles{position:absolute;top:55px;left:0;right:0;z-index:2}
  .heart,.sparkle{position:absolute;bottom:0;pointer-events:none}
  .heart:before,.heart:after{content:"";position:absolute;left:12.5px;top:0;width:12.5px;height:25px;background:var(--color-heart);border-radius:12.5px 12.5px 0 0;transform:rotate(-45deg);transform-origin:0 100%}
  .heart:after{left:0;transform:rotate(45deg);transform-origin:100% 100%}
  .sparkle{width:4px;height:4px;background:var(--color-sparkle);border-radius:50%;animation:sparkleTwinkle 1s infinite}
  .close .heart,.close .sparkle{opacity:0;animation:none}
  .a1{left:20%;transform:scale(0.6);animation:slideUp 4s linear infinite,sideSway 2s ease-in-out infinite alternate}
  .a2{left:55%;animation:slideUp 5s linear infinite,sideSway 4s ease-in-out infinite alternate}
  .a3{left:10%;transform:scale(0.8);animation:slideUp 7s linear infinite,sideSway 2s ease-in-out infinite alternate}
  .s1{left:30%;animation:sparkleUp 3s linear infinite}
  .s2{left:60%;animation:sparkleUp 4s linear infinite}
  .s3{left:45%;animation:sparkleUp 5s linear infinite}
  @keyframes slideUp{0%{top:0}100%{top:-600px}}
  @keyframes sideSway{0%{margin-left:0}50%{margin-left:50px}100%{margin-left:0}}
  @keyframes sparkleUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-500px) rotate(360deg);opacity:0}}
  @keyframes sparkleTwinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
  .reset, .tombol{position:relative;text-align:center;margin-top:20px}
  .reset{margin-top:60px}
  .reset button, .tombol button{font-family:'Sriracha',serif;font-weight:600;transition:all 0.3s ease;background-color:var(--color-flap);border:3px solid white;border-radius:18px 33px 18px 33px;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,0.5);padding:6px 14px;margin:10px;font-size:16px;box-shadow:0 5px 20px rgba(0,0,0,0.15)}
  .reset button:hover, .tombol button:hover{background-color:var(--color-env2);transform:translateY(-3px) scale(1.05);box-shadow:0 7px 25px rgba(0,0,0,0.2)}
  .tombol{transform:scale(0);opacity:0;transition:all .7s ease;z-index:99}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1}
  .pic{font-size:3rem;margin-bottom:1rem}
  h1,h2{font-size:1rem;margin-bottom:1rem;font-weight:700}
  #containerPesan{padding:0;display:block;width:100%;overflow:auto;min-height:100px;max-height:245px;justify-content:left;text-align:left;}
  #teksCinta{font-size:13.5px;color:#fff;font-weight:500}
  #teksLucu{font-size:13.5px;color:#fff;margin-top:1rem;font-weight:500}
  #teksCinta, #teksLucu, #pesanAkhir{font-size:14.3px;text-align:left;text-shadow:0 2px 3px rgba(0,0,0,0.5)}
  p{font-size:13.5px;margin-bottom:1rem;font-weight:500}
  button{font-family:'Montserrat',sans-serif;background:#f43f5e;color:#fff;border:2px solid white;padding:0.3rem 1.2rem;border-radius:999px;font-size:1rem;transition:background 0.3s;font-weight:700}
  button:hover{background:#e11d48;opacity:.8}
  .tombolCadangan{background:#6b7280}
  .tombolCadangan:hover{background:#4b5563}
  .sembunyi, #linkmp3{display:none}
  .stiker{display:flex;justify-content:center;align-items:center;gap:20px;margin-left:auto;margin-right:auto;margin-bottom:20px;transform:scale(0);transition:all .7s ease}
  .stiker img{width:100px;height:100px;box-shadow: 0 4px 30px rgba(255,255,255, 0.3);backdrop-filter: blur(5px);-webkit-backdrop-filter: blur(5px);background: rgba(255, 255, 255, 0.7);border: 3px solid rgba(255, 255, 255, 1);border-radius: 50%;padding:6px;}
  .hati{position:fixed;width:26px;height:26px;opacity:0.7;animation:ngelayang 5s ease-in-out forwards;z-index:0}
  @keyframes ngelayang{0%{transform:translateY(15vh);opacity:0}20%{opacity:0.7}80%{opacity:0.7}100%{transform:translateY(-100vh);opacity:0}}
  .hati svg{width:100%;height:100%;fill:#ff1744;stroke:none;filter:drop-shadow(0 0 8px #ff4081);}
  .wrapper{position:fixed}.circ div{position:fixed;width:60px;height:60px;background-color:transparent;border:6px solid rgba(255,255,255,0.35);border-radius:30%}.circ div:nth-child(1){top:12%;left:42%;animation:animate 10s linear infinite}.circ div:nth-child(2){top:70%;left:50%;animation:animate 7s linear infinite}.circ div:nth-child(3){top:17%;left:6%;animation:animate 9s linear infinite}.circ div:nth-child(4){top:20%;left:60%;animation:animate 10s linear infinite}.circ div:nth-child(5){top:67%;left:10%;animation:animate 6s linear infinite}.circ div:nth-child(6){top:80%;left:70%;animation:animate 12s linear infinite}.circ div:nth-child(7){top:60%;left:80%;animation:animate 15s linear infinite}.circ div:nth-child(8){top:32%;left:25%;animation:animate 16s linear infinite}.circ div:nth-child(9){top:90%;left:25%;animation:animate 9s linear infinite}.circ div:nth-child(10){top:20%;left:80%;animation:animate 5s linear infinite}@keyframes animate{0%{transform:scale(0) translateY(0) rotate(0);opacity:.8}100%{transform:scale(1.3) translateY(-90px) rotate(360deg);opacity:0}}
  .kalkulator-container{margin:20px auto;width:280px;background:linear-gradient(160deg,rgba(92,66,128,.88),rgba(128,72,112,.85));backdrop-filter:blur(10px);border-radius:28px 28px 34px 34px;padding:18px;border:2px solid rgba(255,214,236,.4);box-shadow:0 12px 34px rgba(60,30,80,.55),inset 0 1px 0 rgba(255,255,255,.25);position:absolute;transform:scale(0);transition:all .7s ease}
  .display{background:rgba(40,24,56,.75);color:#ffe3f0;font-size:1.5rem;text-align:right;padding:0 20px;border:2px solid rgba(255,214,236,.25);border-radius:16px;margin-bottom:15px;min-height:56px;display:flex;align-items:center;justify-content:flex-end;font-family:monospace;box-shadow:inset 0 3px 10px rgba(0,0,0,.4);text-shadow:0 0 8px rgba(255,170,210,.6);}
  .buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .btn{background:rgba(205,180,246,.25);color:#fff;border:2px solid rgba(205,180,246,.35);border-radius:16px;padding:10px;font-size:1rem;transition:all .2s;box-shadow:0 3px 0 rgba(30,15,45,.35);}
  .btn:hover{background:rgba(205,180,246,.4);opacity:1;transform:translateY(-2px);}
  .btn-operator{background:linear-gradient(145deg,rgba(255,170,150,.55),rgba(244,140,180,.55));border-color:rgba(255,200,190,.5);}
  .btn-operator:hover{background:linear-gradient(145deg,rgba(255,185,165,.75),rgba(250,155,195,.75));}
  .btn-equals{background:linear-gradient(145deg, #72b8a3, #cb7b9e);border-color:rgba(255,255,255,.6);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);}
  .btn-equals:hover{background:linear-gradient(145deg,#a3ead6,#f7add0);}
  .btn:active{transform:translateY(2px) scale(0.92);filter:brightness(1.2);box-shadow:none;}
  .love-progress{margin:25px auto;width:85%;text-align:center;padding:16px 16px 20px;border-radius:28px 40px 28px 40px;position:relative;overflow:hidden;background:linear-gradient(160deg, rgb(0 0 0 / 30%), rgb(55 46 73 / 24%) 55%, rgb(27 19 20 / 22%));border:1.5px solid rgba(255,225,238,.65);box-shadow:0 10px 32px rgba(255,120,180,.35),0 0 0 4px rgba(255,200,225,.12),inset 0 0 28px rgba(255,255,255,.14);backdrop-filter:blur(6px);}
  .love-progress::before{content:"";position:absolute;top:-45%;left:-20%;width:140%;height:90%;background:radial-gradient(ellipse at center,rgba(255,205,232,.3),transparent 65%);pointer-events:none;}
  .love-progress>*{position:relative;z-index:1}
  .love-progress::after{content:"♥ · ♥ · ♥";display:block;font-size:.85rem;letter-spacing:5px;color:rgba(255,205,228,.95);text-shadow:0 0 10px rgba(255,111,145,.7);animation:denyut 1.6s ease-in-out infinite;position:relative;z-index:1;}
  .love-stiker{display:flex;justify-content:center;align-items:center;margin-bottom:6px;}
  .love-stiker img{width:84px;height:84px;border-radius:50%;padding:5px;background:rgba(255,255,255,.82);border:3px solid rgba(255,214,236,.95);box-shadow:0 4px 22px rgba(255,170,215,.6),0 0 0 5px rgba(205,180,246,.3);animation:melayang 3s ease-in-out infinite;}
  .love-text{font-family: "Sriracha", cursive;font-size:1.9rem;line-height:1.2;font-weight:700;color:#fff;text-shadow:0 2px 2px rgba(255,255,255,.35),0 0 18px rgba(255,111,145,.9),0 0 34px rgba(210,150,255,.65);margin:8px 0;opacity:0;transform:scale(0.6);transition:all 0.6s ease;}
  .progress-bar{height:8px;background:rgba(60,30,80,.4);border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden;margin:12px 6px 14px;box-shadow:inset 0 1px 4px rgba(0,0,0,.35);}
  .progress-fill{height:100%;background:linear-gradient(90deg,#ff9ec1,#f78fb8,#c9a8f7,#ffc9a8,#ff9ec1);background-size:200% 100%;border-radius:999px;box-shadow:0 0 12px rgba(255,130,180,.9);width:0%;transition:width 2.5s cubic-bezier(0.34,1.56,0.64,1);animation:kilau 2s linear infinite;}
  @keyframes kilau{0%{background-position:0% 0}100%{background-position:200% 0}}
  @keyframes denyut{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}}
  @media (max-width:600px){.kotak{width:85%;padding:1rem}#envelope{width:120px;height:82.5px;top:100px}.message p{font-size:1.2em}.kalkulator-container{width:92%;}}

    .pilihan{display:flex;justify-content:center;gap:18px;margin:22px 0;flex-wrap:wrap;transition:all .7s ease}
    .pilihan button{font-size:2.2rem;width:72px;height:72px;display:flex;align-items:center;justify-content:center;padding:10px;/* padding:12px 18px; */border-radius:50%;background:linear-gradient(145deg,rgba(255,200,222,.55),rgba(255,160,200,.35));border:3px solid rgba(255,255,255,.75);box-shadow:0 6px 18px rgba(255,150,200,.4),inset 0 2px 6px rgba(255,255,255,.35);transition:all .3s ease;animation:melayang 3s ease-in-out infinite}
    .pilihan button:nth-child(2){background:linear-gradient(145deg,rgba(215,190,255,.55),rgba(185,150,245,.35));box-shadow:0 6px 18px rgba(190,150,245,.45),inset 0 2px 6px rgba(255,255,255,.35);animation-delay:.4s}
    .pilihan button:nth-child(3){background:linear-gradient(145deg,rgba(190,245,225,.55),rgba(130,215,190,.35));box-shadow:0 6px 18px rgba(130,215,190,.45),inset 0 2px 6px rgba(255,255,255,.35);animation-delay:.8s}
    .pilihan button:hover{transform:scale(1.15);filter:brightness(1.15);border-color:#fff;opacity:1}
    @keyframes melayang{0%,100%{translate:0 0}50%{translate:0 -7px}}
    #judulPilih{transition:all .7s ease;text-shadow:0 2px 6px rgba(0,0,0,.45),0 0 14px rgba(255,190,225,.45);letter-spacing:.3px;line-height:1.5}
    #stiker2 img{border-color:rgba(255,214,236,.95);box-shadow:0 4px 24px rgba(255,170,215,.55),0 0 0 6px rgba(205,180,246,.35);background:rgba(255,255,255,.8)}
</style>
<body>
  <!-- Audio -->
  <audio src="https://feeldreams.github.io/audio/bahagialagi.mp3" id="linkmp3"></audio>
  <!-- Background / Wallpaper -->
  <div class="background-overlay" data-src="https://feeldreams.github.io/nightin.jpeg"></div>
  <!-- Halaman 1: Envelope -->
  <div id="hal1">
    <div class="envlope-wrapper">
      <div id="envelope" class="close">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
          <div class="letter-corner corner-tl"></div>
          <div class="letter-corner corner-br"></div>
          <div class="message">
            <p>Alooo Kamuu! ✨</p>
          </div>
        </div>
        <div class="hearts">
          <div class="heart a1"></div>
          <div class="heart a2"></div>
          <div class="heart a3"></div>
        </div>
        <div class="sparkles">
          <div class="sparkle s1"></div>
          <div class="sparkle s2"></div>
          <div class="sparkle s3"></div>
        </div>
      </div>
    </div>
    <div class="reset">
      <button style="border-radius: 20px;padding:4px 12px;margin-top:-25px" onclick="bukaEnvelope()">Buka</button>
    </div>
  </div>
  <!-- Halaman 2: Pilihan Emoji -->
  <div id="hal2" class="kotak sembunyi">
    <div class="decor decor-tl"></div>
    <div class="decor decor-br"></div>
    <canvas id="game-canvas"></canvas>
    <div id="stiker2" class="stiker">
        <img id="stiker2a" src="https://htmlku.com/0/panda/pusn.gif" />
        <img id="stiker2b" class="sembunyi" src="https://htmlku.com/0/panda/cilukba.gif" />
    </div>
    <h2 id="judulPilih" style="font-size:18.5px;margin-bottom:10px">Kamu Pilih yang Mana? 🫣</h2>
    <div class="pilihan" id="pilihanContainer">
      <button onclick="pilihEmoji(1)">🖖🏻</button>
      <button onclick="pilihEmoji(2)">✌🏻</button>
      <button onclick="pilihEmoji(3)">🤙🏻</button>
    </div>
  </div>
  <!-- Halaman 3: Kalkulator -->
  <div id="hal3" class="kotak sembunyi">
    <div class="decor decor-tl"></div>
    <div class="decor decor-br"></div>
    <!-- Stiker Gif -->
    <div id="stiker3" class="stiker">
        <img id="stiker3a" src="https://htmlku.com/0/panda/cubit.gif" />
    </div>
    <h2 id="kalkuJdl" style="font-size:18.5px;line-height:1.2em;"><span style="font-size:17px;font-weight:400">Sekarang coba jawab ini 😆</span><br><br><b style="font-size:35px">8 + 2</b><br><br><span style="font-size:18.5px">Berapa ya? 🤔</span></h2>
    <p id="kalkuSubJdl" style="font-size:14.5px;margin-bottom:15px">Hitung pakai kalkulator ini yaa~</p>
    <button id="kalkuBtn" onclick="bukaKalkulator()">Mulai Hitung! 👀</button>
   
    <div class="kalkulator-container" id="kalkulator">
      <div class="display" id="display">0</div>
      <div class="buttons">
        <button class="btn" onclick="appendToDisplay('7')">7</button>
        <button class="btn" onclick="appendToDisplay('8')">8</button>
        <button class="btn" onclick="appendToDisplay('9')">9</button>
        <button class="btn btn-operator" onclick="appendToDisplay('+')">+</button>
       
        <button class="btn" onclick="appendToDisplay('4')">4</button>
        <button class="btn" onclick="appendToDisplay('5')">5</button>
        <button class="btn" onclick="appendToDisplay('6')">6</button>
        <button class="btn btn-operator" onclick="appendToDisplay('-')">-</button>
       
        <button class="btn" onclick="appendToDisplay('1')">1</button>
        <button class="btn" onclick="appendToDisplay('2')">2</button>
        <button class="btn" onclick="appendToDisplay('3')">3</button>
        <button class="btn btn-operator" onclick="appendToDisplay('*')">×</button>
       
        <button class="btn" onclick="clearDisplay()">C</button>
        <button class="btn" onclick="appendToDisplay('0')">0</button>
        <button class="btn" onclick="appendToDisplay('.')">.</button>
        <button class="btn btn-equals" onclick="calculate()">=</button>
      </div>
    </div>
   
    <div class="love-progress sembunyi" id="loveSection">
      <div class="love-stiker">
        <img src="https://htmlku.com/0/panda/muah.gif" />
      </div>
      <div class="love-text" id="loveText">I Love U 0%</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>
  <!-- Halaman 4: Pesan Akhir -->
  <div id="hal4" class="kotak sembunyi">
    <div class="decor decor-tl"></div>
    <div class="decor decor-br"></div>
    <!-- Stiker Gif -->
    <div id="stiker4" class="stiker">
        <img id="stiker4a" src="https://htmlku.com/0/panda/terlope.gif" />
        <img id="stiker4b" class="sembunyi" src="https://htmlku.com/0/panda/ciumpipi.gif" />
        <img id="stiker4c" class="sembunyi" src="https://htmlku.com/0/panda/.gif" />
    </div>
    <div id="containerPesan">
      <p id="teksCinta"></p>
      <p id="pesanAkhir"></p>
      <p id="teksLucu"></p>
    </div>
    <button style="display:none" onclick="shareWa()">Kirim ke Dia!</button>
  </div>
  <div class="tombol">
    <button style="padding:4px 12px;" onclick="balasWa()">💌 Balas</button>
  </div>
  <!-- Circle Animation -->
  <div>
        <div>
            <div class="circ">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>
  <script>
    // Edit Kata-kata di Sini

    function mulaiKelopak(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const kelopak = Array.from({ length: 20 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 5 + 2,
        speed: Math.random() * 2 + 1
      }));
      function gambarKelopak() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        kelopak.forEach(petal => {
          ctx.beginPath();
          ctx.arc(petal.x, petal.y, petal.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#f87171';
          ctx.fill();
          petal.y += petal.speed;
          if (petal.y > canvas.height) petal.y = -petal.radius;
          petal.x += Math.sin(petal.y / 50) * 2
        });
        requestAnimationFrame(gambarKelopak);
      }
      gambarKelopak();
